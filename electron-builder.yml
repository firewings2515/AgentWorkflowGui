# Windows installer (T044). Unsigned, per-user NSIS; no auto-update, nothing is published.
appId: com.firewings2515.agentworkflowgui
productName: AgentWorkflowGui
copyright: Copyright 2026 firewings2515
directories:
  output: release
  buildResources: build-resources
publish: null
electronLanguages: [en-US, zh-TW]

# Only the built app and what the main process requires at run time. The renderer is bundled by vite, so its
# libraries (react, @xyflow/react and their dependencies) stay out of the installer.
files:
  - out/**
  - package.json
  - LICENSE
  - NOTICE
  - '!node_modules/react{,/**}'
  - '!node_modules/react-dom{,/**}'
  - '!node_modules/scheduler{,/**}'
  - '!node_modules/@xyflow{,/**}'
  - '!node_modules/d3-*{,/**}'
  - '!node_modules/zustand{,/**}'
  - '!node_modules/classcat{,/**}'
  # The Claude CLI the Agent SDK ships (@anthropic-ai/claude-agent-sdk-<platform>-<arch>, ~285 MB, proprietary licence) is
  # not distributed (T045): the app starts the user's own Claude Code. The SDK package itself (JS only) stays.
  - '!node_modules/@anthropic-ai/claude-agent-sdk-*{,/**}'
  # Documentation and sources go; licence and notice files stay (scripts/check-licenses.mjs checks them).
  - '!node_modules/**/*.{map,ts,tsx}'
  - '!node_modules/**/{README,CHANGELOG,HISTORY,CONTRIBUTING,SECURITY,CODE_OF_CONDUCT}{,.*}.md'
  - '!node_modules/**/{test,tests,__tests__,docs,example,examples}{,/**}'

# Native code cannot run from inside app.asar: koffi's .node is unpacked next to it. No executable is shipped; Claude
# Code and Codex are the user's own installs (app/main/claude-exe.ts, codex-exe.ts).
asar: true
asarUnpack:
  - node_modules/koffi/**
  - node_modules/@koromix/**

extraResources:
  - from: build-resources/THIRD_PARTY_LICENSES.txt
    to: THIRD_PARTY_LICENSES.txt

win:
  target:
    - target: nsis
      arch: [x64]
  # No certificate is configured: the installer and the exe are unsigned (docs/RELEASE.md).
  verifyUpdateCodeSignature: false
  artifactName: '${productName}-Setup-${version}-${arch}.${ext}'

nsis:
  # Assisted, not one-click (T049): it installs at once with no questions, then stops on a finish page that shows the
  # folder and a ticked "run now" box (installer/installer.nsh). Still per-user only, no administrator rights.
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: false
  runAfterFinish: true
  include: installer/installer.nsh
  # The finish page text is Chinese, so the whole installer is too.
  multiLanguageInstaller: false
  language: '1028'
  createDesktopShortcut: false
  createStartMenuShortcut: true
  # Uninstalling keeps %APPDATA%\AgentWorkflowGui (the database and backups).
  deleteAppDataOnUninstall: false
